name: Local network

# Deploys the committed out/main.wasm to a local Stellar network in Docker
# and calls every row of e2e/vectors.tsv with the pinned stellar CLI, exactly
# as scripts/e2e-local.sh does on a developer's machine. The canary checks
# that the committed module is what the ledger toolchain builds, so no
# Inference toolchain is needed here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (local network)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Docker
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version

      - name: Deploy and call every method
        run: bash scripts/e2e-local.sh
