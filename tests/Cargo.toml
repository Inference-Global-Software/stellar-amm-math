[package]
name = "stellar-amm-math-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Host tests and the cost ledger of the stellar-amm-math contract"
license = "Apache-2.0"
# Every target is declared below, and tests/repo.rs checks that no file is left
# out: a target Cargo discovered on its own would build with default settings.
autobins = false
autotests = false

# A standalone crate: the repository root is an Inference project, not a Cargo
# workspace.
[workspace]

[dependencies]
# A normal dependency, not a dev-dependency: src/bin/cost.rs is a binary and
# cannot see dev-dependencies. `testutils` provides the in-process Soroban host.
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }
# The cost ledger hashes the module and its interface. soroban-env-host already
# depends on this version, so it adds no package to the lock.
sha2 = "=0.10.9"

[dev-dependencies]
# Runs the proof module and the test shell, which Soroban cannot load (they are
# plain wasm32 modules, not contracts).
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate"] }
# Reads the ledger's rows. soroban-sdk already depends on this version, so it
# adds no package to the lock.
serde_json = "=1.0.151"

# The crate has no doc-tests, and the cost binary no tests of its own: without
# these, `cargo test` builds and runs two empty harnesses.
[lib]
doctest = false

[[bin]]
name = "cost"
path = "src/bin/cost.rs"
test = false

# Dependencies build as they run in production: optimized, and without debug
# assertions or overflow checks (wasmi's debug assertions alone slow it down
# tenfold). This crate itself stays a debug build. Measured on get_amount_out:
# the Soroban host takes 315 us per call in a plain debug build and 16 us here,
# and wasmi 972 us and 2.6 us. A first build takes about 20 s longer.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[[test]]
name = "contract"
path = "contract.rs"

[[test]]
name = "wasm32"
path = "wasm32.rs"

[[test]]
name = "wide"
path = "wide.rs"

[[test]]
name = "specs"
path = "specs.rs"

[[test]]
name = "repo"
path = "repo.rs"
